<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHub - Centre d'aide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .contenu-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px;
        }
        .retour-param {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            text-decoration: none;
            color: #C2286B;
            font-weight: 500;
        }
        .retour-param:hover {
            text-decoration: underline;
            color: #FAB940;
        }
        .formulaire-aide {
            margin-top: 16px;
        }
        .formulaire-aide h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 19px;
            font-size: 21px;
            color: #25104D;
        }
        .groupe-champ {
            margin-bottom: 19px;
        }
        .groupe-champ label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #25104D;
        }
        .groupe-champ label i {
            margin-right: 6px;
            color: #C2286B;
        }
        .groupe-champ input,
        .groupe-champ textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid rgba(91, 28, 46, 0.3);
            border-radius: 16px;
            font-family: inherit;
            font-size: 14px;
            background: white;
            transition: border 0.2s;
        }
        .groupe-champ input:focus,
        .groupe-champ textarea:focus {
            outline: none;
            border-color: #C2286B;
            box-shadow: 0 0 0 2px rgba(194, 40, 107, 0.1);
        }
        .btn-envoyer {
            background: #FAB940;
            color: #25104D;
            border: none;
            padding: 11px 24px;
            font-size: 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-envoyer:hover {
            background: #C2286B;
            color: white;
        }
        .message-info {
            font-size: 13px;
            color: #5B1C2E;
            margin-top: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="hamburger"><i class="fas fa-bars"></i></div>
        </div>
        <div class="profil-container">
            <img src="https://via.placeholder.com/80?text=Avatar" alt="Photo" class="avatar">
            <span class="profil-nom">Jean Dupont</span>
        </div>
        <ul class="nav-principale">
            <li class="nav-item"><a href="accueil.html"><span class="nav-icon"><i class="fas fa-home"></i></span><span>ACCUEIL</span></a></li>
            <li class="nav-item"><a href="#"><span class="nav-icon"><i class="fas fa-users"></i></span><span>COMMUNAUTE</span></a></li>
            <li class="nav-item"><a href="explorer.html"><span class="nav-icon"><i class="fas fa-compass"></i></span><span>EXPLORER</span></a></li>
            <li class="nav-item"><a href="#"><span class="nav-icon"><i class="fas fa-bell"></i></span><span>NOTIFICATION</span></a></li>
            <li class="nav-item"><a href="#"><span class="nav-icon"><i class="fas fa-envelope"></i></span><span>MESSAGERIE</span></a></li>
            <li class="nav-item"><a href="parametres.html"><span class="nav-icon"><i class="fas fa-sliders-h"></i></span><span>PARAMETRES</span></a></li>
        </ul>
    </aside>

    <main class="contenu-page">
        <div class="carte-blanche">
            <a href="parametres.html" class="retour-param">
                <i class="fas fa-arrow-left"></i> Paramètres
            </a>
            <h1><i class="fas fa-headset"></i> Centre d'aide</h1>

            <div class="formulaire-aide">
                <h2><i class="fas fa-envelope"></i> NOUS CONTACTER</h2>
                <form id="formulaireContact">
                    <div class="groupe-champ">
                        <label for="nomComplet"><i class="fas fa-user"></i> NOM COMPLET</label>
                        <input type="text" id="nomComplet" name="nom" placeholder="Votre prénom et nom" required>
                    </div>
                    <div class="groupe-champ">
                        <label for="email"><i class="fas fa-at"></i> ADRESSE MAIL</label>
                        <input type="email" id="email" name="email" placeholder="exemple@connecthub.fr" required>
                    </div>
                    <div class="groupe-champ">
                        <label for="message"><i class="fas fa-pen-alt"></i> VOTRE MESSAGE</label>
                        <textarea id="message" name="message" placeholder="Décrivez votre problème ou votre demande..." required></textarea>
                    </div>
                    <button type="submit" class="btn-envoyer"><i class="fas fa-paper-plane"></i> Envoyer le message</button>
                    <div class="message-info"><i class="fas fa-clock"></i> Notre équipe vous répond sous 48h ouvrées.</div>
                </form>
            </div>
        </div>
    </main>
</div>
<footer>
    <p>Copyright | © 2026, ConnectHub</p>
</footer>

<script>
    // Gestion de l'envoi du formulaire (appel AJAX vers aide.php)
    document.getElementById('formulaireContact').addEventListener('submit', async function(e) {
        e.preventDefault();
        const nom = document.getElementById('nomComplet').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!nom || !email || !message) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        // Préparer les données pour l'envoi
        const formData = new FormData();
        formData.append('nom', nom);
        formData.append('email', email);
        formData.append('message', message);

        try {
            // Appel au fichier PHP aide.php 
            const response = await fetch('aide.php', {
                method: 'POST',
                body: formData
            });
            const result = await response.text();
            if (response.ok && result === 'success') {
                alert("Merci ! Votre message a été envoyé aux modérateurs. Ils vous répondront rapidement.");
                document.getElementById('formulaireContact').reset();
            } else {
                alert("Erreur : " + (result || "Problème technique, veuillez réessayer."));
            }
        } catch (error) {
            alert("Erreur réseau : impossible de contacter le serveur. Vérifiez votre connexion.");
        }
    });
</script>
</body>
</html>
