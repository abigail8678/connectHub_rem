<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHub - Information complémentaire</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .contenu-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px;
        }
        .retour-param {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            text-decoration: none;
            color: #C2286B;
            font-weight: 500;
        }
        .retour-param:hover {
            text-decoration: underline;
            color: #FAB940;
        }
        .liens-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }
        .carte-lien {
            background: #F8F4FF;
            border-radius: 16px;
            padding: 16px;
            transition: background 0.2s;
            border: 1px solid rgba(91,28,46,0.1);
        }
        .carte-lien:hover {
            background: #FEF9F0;
        }
        .carte-lien a {
            display: flex;
            align-items: center;
            gap: 13px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            color: #25104D;
        }
        .carte-lien a i {
            color: #C2286B;
            font-size: 21px;
        }
        .carte-lien a:hover {
            color: #C2286B;
        }
    </style>
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="hamburger"><i class="fas fa-bars"></i></div>
        </div>
        <div class="profil-container">
            <img src="https://via.placeholder.com/80?text=Avatar" alt="Photo" class="avatar">
            <span class="profil-nom">Jean Dupont</span>
        </div>
        <ul class="nav-principale">
            <li class="nav-item"><a href="accueil.html"><span class="nav-icon"><i class="fas fa-home"></i></span><span>ACCUEIL</span></a></li>
            <li class="nav-item"><a href="#"><span class="nav-icon"><i class="fas fa-users"></i></span><span>COMMUNAUTE</span></a></li>
            <li class="nav-item"><a href="explorer.html"><span class="nav-icon"><i class="fas fa-compass"></i></span><span>EXPLORER</span></a></li>
            <li class="nav-item"><a href="#"><span class="nav-icon"><i class="fas fa-bell"></i></span><span>NOTIFICATION</span></a></li>
            <li class="nav-item"><a href="#"><span class="nav-icon"><i class="fas fa-envelope"></i></span><span>MESSAGERIE</span></a></li>
            <li class="nav-item"><a href="parametres.html"><span class="nav-icon"><i class="fas fa-sliders-h"></i></span><span>PARAMETRES</span></a></li>
        </ul>
    </aside>

    <!-- Contenu -->
    <main class="contenu-page">
        <div class="carte-blanche">
            <a href="parametres.html" class="retour-param">
                <i class="fas fa-arrow-left"></i> PARAMETRES
            </a>
            <h1><i class="fas fa-circle-info"></i> Information complémentaire</h1>
            <div class="liens-container">
                <div class="carte-lien">
                    <a href="questions.html">
                        <i class="fas fa-question-circle"></i> Questions fréquentes
                    </a>
                </div>
                <div class="carte-lien">
                    <a href="cu.html">
                        <i class="fas fa-file-contract"></i> Conditions d'utilisations
                    </a>
                </div>
            </div>
        </div>
    </main>
</div>
<footer>
    <p>Copyright | © 2026, ConnectHub</p>
</footer>

</html>
